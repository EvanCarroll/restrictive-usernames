[package]
name = "restrictive-usernames-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
restrictive-usernames = { path = "..", features = ["check", "corpus"] }
unicode-normalization = "0.1"

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keys"
path = "fuzz_targets/keys.rs"
test = false
doc = false
bench = false

# Not a member of the repository workspace: cargo-fuzz builds this crate on
# nightly with sanitizer flags, which the workspace's stable builds must not
# pick up.
[workspace]
members = ["."]
