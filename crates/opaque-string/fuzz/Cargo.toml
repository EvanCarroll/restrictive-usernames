[package]
name = "opaque-string-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
opaque-string = { path = ".." }
# The same tables opaque-string links; the properties check NFC with them.
unicode-normalization = "=0.1.25"
serde_json = "1"

[[bin]]
name = "prepare"
path = "fuzz_targets/prepare.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enforce"
path = "fuzz_targets/enforce.rs"
test = false
doc = false
bench = false

# Not a member of the repository workspace: cargo-fuzz builds this crate on
# nightly with sanitizer flags, which the workspace's stable builds must not
# pick up.
[workspace]
members = ["."]
