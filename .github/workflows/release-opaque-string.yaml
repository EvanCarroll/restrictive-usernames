# Publish opaque-string from an opaque-string-v<version> tag: the crate to
# crates.io, the npm package, and a GitHub release carrying the
# crates/opaque-string/CHANGELOG.md entry. Versioned independently of the
# workspace: release.yaml (v* tags) never publishes it, and this never
# publishes restrictive-usernames. GitHub matches tag globs from the start of
# the name, so v* and opaque-string-v* never trigger each other.
#
# One-time setup (the first version of the crate and of the npm package is
# published by hand; the jobs below skip a version that already exists):
#   * crates.io: trusted publisher for opaque-string, this repository,
#     workflow release-opaque-string.yaml, environment release.
#   * npm: trusted publisher for opaque-string, same repository and
#     workflow; then remove the `if: false` on the npm job.
name: Release opaque-string

on:
  push:
    tags: ["opaque-string-v*"]

permissions:
  contents: read

concurrency:
  group: release-opaque-string
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag, both crates and the CHANGELOG agree
        id: version
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --no-deps)
          v=$(jq -er '[.packages[] | select(.name == "opaque-string") | .version][0]' <<<"$meta")
          w=$(jq -er '[.packages[] | select(.name == "opaque-string-wasm") | .version][0]' <<<"$meta")
          [ "opaque-string-v${v}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != opaque-string-v${v}" >&2; exit 1; }
          [ "$w" = "$v" ] || { echo "opaque-string-wasm ${w} != opaque-string ${v}" >&2; exit 1; }
          grep -q "^## ${v} " crates/opaque-string/CHANGELOG.md \
            || { echo "crates/opaque-string/CHANGELOG.md has no '## ${v} ' entry" >&2; exit 1; }
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  # The crate's own suite against the tagged commit (not ci.yaml, which
  # would build every PostgreSQL image).
  ci:
    needs: verify
    uses: ./.github/workflows/opaque-string.yaml

  crate:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Already on crates.io?
        id: published
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "opaque-string release (${{ github.server_url }}/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/opaque-string/${v}")
          case "$code" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT"; echo "opaque-string ${v} is already published" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered HTTP ${code}" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        if: steps.published.outputs.skip == 'false'
        id: auth
      - name: cargo publish
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p opaque-string

  npm:
    # Disabled until the first manual publish / credentials exist (npm trusted publisher); remove this line to re-enable.
    if: false
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BINARYEN_VERSION: "133"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Toolchain, wasm-bindgen CLI, wasm-opt
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          v=$(cargo metadata --format-version 1 | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[0]')
          cargo install wasm-bindgen-cli --locked --version "$v"
          curl -fsSL --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build and test the package
        run: crates/opaque-string-wasm/build-npm.sh --test --pack
      # Trusted publishing (OIDC): no token, provenance attached.
      - name: npm publish
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          if [ "$(npm view "opaque-string@${v}" version 2>/dev/null || true)" = "$v" ]; then
            echo "opaque-string ${v} is already published"
            exit 0
          fi
          cd target/npm/opaque-string && npm publish --provenance --access public

  github-release:
    # npm is disabled above; add it back to needs when re-enabled.
    needs: [verify, crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' crates/opaque-string/CHANGELOG.md > notes.md
          # Not --latest: the repository's latest release stays
          # restrictive-usernames'.
          gh release create "${GITHUB_REF_NAME}" \
            --title "opaque-string ${v}" --notes-file notes.md --verify-tag --latest=false
